  <!-- Aplica tema i idioma abans de pintar, per evitar parpelleigs -->
  <script>
    (function () {
      var d = document.documentElement, s = {};
      try { s.t = localStorage.getItem("theme"); s.l = localStorage.getItem("lang"); } catch (e) {}
      var u = new URLSearchParams(location.search), qt = u.get("theme");
      var t = (qt === "light" || qt === "dark") ? qt : (s.t || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
      var q = u.get("lang");
      var l = (q === "ca" || q === "es" || q === "en") ? q : (s.l || ({ ca: "ca", es: "es", en: "en" }[(navigator.language || "ca").slice(0, 2)] || "ca"));
      d.setAttribute("data-theme", t);
      d.setAttribute("lang", l);
      d.classList.add("js");
    })();
  </script>
